<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer un Compte — CEPEED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--navy-900);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .activation-box{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .activation-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;}
  .activation-logo .logo-icon{width:40px;height:40px;border-radius:10px;background:var(--blue-accent);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
  .activation-logo span{font-weight:800;font-size:24px;color:var(--navy-900);letter-spacing:.5px;}
  .activation-sub{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:26px;}
  .badge-licence{display:block;text-align:center;margin-bottom:20px;}
</style>
</head>
<body>
  <div class="activation-box">
    <div class="activation-logo"><div class="logo-icon"><img src="img/logo.png" alt="GESLO" class="logo-icon"></div><span>GESLO</span></div>
    <div class="activation-sub">Logiciel activé ✔ — configurez votre compte</div>
    <span class="badge badge-green badge-licence" id="licenceBadge"></span>

    <div class="form-group"><label>Nom de l'Établissement</label><input type="text" id="cEtablissement" placeholder="Ex: GESLO School International" required></div>
    <div class="form-group"><label>Année Scolaire</label><input type="text" id="cAnnee" value="2025-2026"></div>
    <div class="divider"></div>
    <div class="form-row">
      <div class="form-group"><label>Votre Nom Complet</label><input type="text" id="cNom" placeholder="ex: Marie Loemba"></div>
      <div class="form-group"><label>Rôle</label>
        <select id="cRole"><option>Comptable</option><option>Directeur Général (DG)</option><option>Directeur des Études (DE)</option><option>Secrétaire</option><option>Autre</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="cEmail" placeholder="optionnel"></div>
      <div class="form-group"><label>Téléphone</label><input type="tel" id="cTel" placeholder="optionnel"></div>
    </div>

    <button class="btn btn-primary btn-block mt-8" onclick="creerCompte()">✔ Créer le Compte et Démarrer</button>
    <p class="small text-muted mt-16" style="text-align:center;">Toutes les données seront ensuite stockées uniquement sur cette machine.</p>
  </div>

<script src="js/data.js"></script>
<script src="js/branding.js"></script>
<script src="js/compte-creation.js"></script>
</body>
</html>
