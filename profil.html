<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Profil — CEPEED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="content-header">
        <h1 class="page-title">MON PROFIL & UTILISATEUR</h1>
        <p class="page-subtitle">Informations du compte connecté à ce poste</p>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="flex gap-12 mb-16" style="align-items:center;">
            <div class="avatar" style="width:64px;height:64px;font-size:22px;" id="profAvatar"></div>
            <div>
              <div style="font-weight:800;font-size:16px;" id="profNom"></div>
              <div class="small text-muted" id="profMatricule"></div>
              <div class="small text-muted" id="profRole"></div>
            </div>
          </div>

          <div class="tabs">
            <div class="tab active" data-panel="infos">Informations Générales</div>
            <div class="tab" data-panel="activite">Journal d'Activité</div>
          </div>

          <div id="panel-infos">
            <div class="form-group"><label>Nom Complet</label><input type="text" id="fProfNom"></div>
            <div class="form-row">
              <div class="form-group"><label>Email</label><input type="email" id="fProfEmail"></div>
              <div class="form-group"><label>Téléphone</label><input type="tel" id="fProfTel"></div>
            </div>
            <div class="form-group"><label>Rôle</label>
              <select id="fProfRole"><option>Comptable</option><option>Directeur Général (DG)</option><option>Directeur des Études (DE)</option><option>Secrétaire</option><option>Surveillant</option></select>
            </div>
            <button class="btn btn-primary" onclick="saveProfil()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg> Enregistrer</button>
          </div>

          <div id="panel-activite" style="display:none;">
            <div id="profActivity"></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Sécurité du Compte</div>
          <button class="btn btn-outline btn-block mb-16" onclick="toast('✔ Un lien de changement de mot de passe a été généré')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-icon lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Changer le mot de passe</button>
          <button class="btn btn-outline btn-block mb-16" onclick="toast('✔ Authentification à deux facteurs activée')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-ellipsis-icon lucide-shield-ellipsis"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg> Authentification à deux facteurs</button>
          <div class="divider"></div>
          <div class="section-title">Licence du Logiciel</div>
          <p class="small"><b>Clé</b>: <span id="licKey">-</span></p>
          <p class="small"><b>Activée le</b>: <span id="licDate">-</span></p>
          <p class="small"><b>ID de cette machine</b>: <span id="licMachine" style="word-break:break-all;">-</span></p>
          <div class="divider"></div>
          <div class="section-title">Statistiques du Compte</div>
          <p class="small"><b>Actions enregistrées</b>: <span id="statActions">0</span></p>
          <p class="small"><b>Dernière activité</b>: <span id="statDerniere">-</span></p>
          <div class="divider"></div>
          <button class="btn btn-dark btn-block" onclick="deconnexion()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-alert-icon lucide-shield-alert"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg> Déconnexion</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/profil.js"></script>
</body>
</html>
