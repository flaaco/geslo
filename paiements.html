<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiements — CEPEED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="grid grid-2-eq">

        <!-- ===== LEFT: PORTAIL / ÉCHÉANCES ===== -->
        <div>
          <h1 class="page-title mb-16">PORTAIL DE GESTION FINANCIÈRE</h1>
          <div class="card mb-16">
            <div class="alert-box mb-16">
              <div class="alert-box-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-triangle-alert-icon lucide-triangle-alert"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> TABLEAU DE BORD DES ÉCHÉANCES & ALERTES</div>
            </div>
            <select id="classeFilter" onchange="renderClasses()" style="margin-bottom:14px;">
              <option value="">Toutes les classes</option>
            </select>
            <div id="classCards" class="grid grid-2-eq"></div>
          </div>

          <div class="card">
            <div class="section-title">Summaire des alertes immédiats:</div>
            <ul id="alertList" style="padding-left:18px;font-size:13px;line-height:1.9;"></ul>
            <button class="btn btn-dark btn-block mt-8" onclick="genererRapportRetard()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg> Générer Rapports de Retard</button>
          </div>
        </div>

        <!-- ===== RIGHT: NOUVEAU PAIEMENT ===== -->
        <div>
          <h1 class="page-title mb-16">NOUVEAU PAIEMENT & REÇU RAPIDE</h1>
          <div class="card">
            <div class="form-group">
              <label>Rechercher élève</label>
              <div class="flex gap-8">
                <input type="text" id="searchPayEleve" placeholder="Nom ou matricule" oninput="filterEleve(this.value)">
                <button class="btn btn-primary" onclick="lockEleve()">Paiement</button>
              </div>
              <div id="eleveResults" class="small mt-8"></div>
            </div>

            <div class="tabs">
              <div class="tab" data-t="1">1. Inscription</div>
              <div class="tab" data-t="2">2. Réinscription</div>
              <div class="tab active" data-t="3">3. Frais Mixtes</div>
              <div class="tab" data-t="4">4. Services</div>
            </div>

            <div id="feeChecklist"></div>

            <div class="flex-between mt-16" style="font-weight:800;font-size:15px;">
              <span>Sous-Total:</span><span id="sousTotal">0 FCFA</span>
            </div>

            <div class="divider"></div>

            <div class="form-group">
              <label>Remises & Promotions</label>
              <select id="remise" onchange="recalc()">
                <option value="0">Aucune remise</option>
                <option value="10">Promotion Familiale -10%</option>
                <option value="5">Bourse Partielle -5%</option>
              </select>
            </div>
            <div class="form-group">
              <label>Mode de Paiement</label>
              <select id="modePaiement">
                <option>Espèces</option><option>MTN MoMo</option><option>Orange Money</option><option>Banque</option><option>Virement</option>
              </select>
            </div>
            <div class="form-group">
              <label>Détails Mobile Money</label>
              <input type="text" id="momoNum" placeholder="numér: +242 06 600 XXXX">
            </div>
            <div class="form-group">
              <label>Caissier</label>
              <select id="caissier"><option>Marie</option><option>Alain</option><option>Sylvie</option></select>
            </div>

            <div class="flex gap-8 mt-16">
              <button class="btn btn-primary" onclick="validerPaiement()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-check-icon lucide-check-check"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg> Valider Paiement</button>
              <button class="btn btn-outline" onclick="ouvrirRecu()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg> Imprimer Reçu</button>
              <button class="btn btn-outline" onclick="envoyerConfirmationSMS()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-more-icon lucide-message-circle-more"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg> Envoyer Confirmation SMS</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/paiements.js"></script>
</body>
</html>
