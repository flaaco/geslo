<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Parcours Scolaire — CEPEED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="content-header flex-between">
        <h1 class="page-title">PARCOURS SCOLAIRE COMPLET</h1>
        <select id="eleveSelect" onchange="loadParcours(this.value)" style="max-width:280px;"></select>
      </div>

      <div class="card mb-16">
        <div class="flex-between">
          <div class="flex gap-12" style="align-items:center;">
            <div id="pPhotoBox"></div>
            <div>
              <div style="font-weight:800;font-size:18px;" id="pNom"></div>
              <div class="text-muted small" id="pClasse"></div>
              <div class="small">Statut: <span class="badge badge-green" id="pStatut">Inscrit</span></div>
            </div>
          </div>
          <button class="btn btn-dark" onclick="window.print()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg> Imprimer Carnet de Parcours</button>
        </div>
      </div>

      <div class="card mb-16">
        <div class="section-title">Historique Détaillé des Années Scolaires</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Année</th><th>Classe</th><th>Moyenne</th><th>Décision</th><th>Actions</th></tr></thead>
            <tbody id="histoBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Analyse Comparative (Optionnel)</div>
        <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Évolution des Moyennes</div>
        <div class="chart-box" style="height:220px;"><canvas id="chartMoyennes"></canvas></div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/parcours.js"></script>
</body>
</html>
